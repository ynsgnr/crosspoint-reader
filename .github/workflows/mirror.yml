# Mirror feature checks (new file; see mirror/MIRROR_CHANGES.md). Independent of the upstream workflows.
name: mirror

# A branch with an open pull request builds once, on the pull request: push only builds develop and develop-retink
# (develop-retink is the "develop" firmware channel, see .github/workflows/ota-publish.yml).
# The X4 (ESP32-C3) image is only built on demand (Actions > mirror > Run workflow).
on:
  push:
    branches: [develop, develop-retink]
    paths: ['mirror/**', 'scripts/ota/**', 'platformio.ini', 'src/activities/home/**', 'src/components/CoverGridHomeUi.*', '.github/workflows/mirror.yml']
  pull_request:
    paths: ['mirror/**', 'platformio.ini', 'src/activities/home/**', 'src/components/CoverGridHomeUi.*', '.github/workflows/mirror.yml', 'scripts/ota/**']
  workflow_dispatch:

# A newer push to the same branch replaces the run that is still going.
concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: Host tests and simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and test
        run: |
          cmake -S mirror -B build-mirror -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-mirror -j"$(nproc)"
          ctest --test-dir build-mirror --output-on-failure
      - name: OTA manifest script
        run: python3 scripts/ota/test_manifest.py
      - name: Simulator renders a transcript
        run: build-mirror/mirror_sim mirror/test/golden/chat/typing.txt sim-out && test -s sim-out/frame_000.png
      - uses: actions/upload-artifact@v6
        with:
          name: mirror-simulator-frames
          path: sim-out

  ota-scripts:
    name: OTA scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Channel manifest tool, fixture and signature round trip
        run: python3 scripts/ota/test_channels.py
      - name: Shell syntax of the publisher
        run: bash -n scripts/ota/publish.sh

  generated-files:
    name: Generated files untouched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: mirror/scripts/check-manifest.sh

  spec-sync:
    name: Generated files match the Android repo spec
    runs-on: ubuntu-latest
    # Needs read access to the (private) Android repo: set the variable RETINK_REPO and the secret RETINK_TOKEN. Skipped without them.
    if: ${{ vars.RETINK_REPO != '' }}
    steps:
      - uses: actions/checkout@v6
        with: { path: fork, persist-credentials: false }
      - uses: actions/checkout@v6
        with:
          repository: ${{ vars.RETINK_REPO }}
          token: ${{ secrets.RETINK_TOKEN }}
          path: retink
          persist-credentials: false
      - run: pip install pyyaml
      - run: retink/scripts/sync-fork.sh --check "$GITHUB_WORKSPACE/fork"

  firmware:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"env":"x4pro-macro","asset":"firmware-x4pro-mirror.bin"},{"env":"macro","asset":"firmware-mirror.bin"}]' || '[{"env":"x4pro-macro","asset":"firmware-x4pro-mirror.bin"}]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      # Same toolchain recipe as .github/workflows/ci.yml.
      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v3-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'mirror/platformio_mirror.ini', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: pio-v3-${{ runner.os }}-${{ matrix.env }}-

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Custom-sdkconfig envs run a nested `pio run`; keep its core on the outer version
          # (see the same step in ci.yml and pioarduino/platform-espressif32#529).
          pio pkg install -e ${{ matrix.env }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build ${{ matrix.env }} firmware
        run: |
          set -euo pipefail
          pio run -e ${{ matrix.env }} | tee pio.log
          {
            echo "## ${{ matrix.env }} firmware build stats"
            grep -E "(RAM|Flash):\s" pio.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware image
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error

  # The OTA channel of this build: the develop branch, or the pull request. Same-repository branches only (a fork's pull
  # request never reaches the device's channel list), and only when the signing key secret exists. The image is signed
  # into channels.json (ECDSA P-256); the device checks that signature before it reads anything.
  publish:
    name: Publish OTA channel
    needs: firmware
    if: ${{ github.repository == 'ynsgnr/crosspoint-reader' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ota-channels
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
      CHANNEL: ${{ github.event_name == 'push' && 'develop' || format('pr-{0}', github.event.pull_request.number) }}
      TITLE: ${{ github.event_name == 'push' && 'develop branch' || github.event.pull_request.title }}
      SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
    steps:
      - name: Signing key present?
        id: key
        run: |
          if [ -n "$OTA_SIGNING_KEY" ]; then echo "have=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::OTA_SIGNING_KEY is not set: no OTA channel is published"; fi

      - uses: actions/checkout@v6
        if: steps.key.outputs.have == 'true'

      - uses: actions/download-artifact@v6
        if: steps.key.outputs.have == 'true'
        with:
          name: firmware-x4pro-mirror.bin
          path: image

      - name: Publish
        if: steps.key.outputs.have == 'true'
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          rev="${SHA:0:8}"
          base="https://github.com/$repo/releases/download/ota/"
          work="$RUNNER_TEMP/ota"
          mkdir -p "$work"
          (umask 077; printf '%s\n' "$OTA_SIGNING_KEY" > "$work/key.pem")
          # Publishing with a key the firmware does not trust would only make every device refuse the list.
          python3 scripts/ota/manifest.py check-key --key "$work/key.pem" --header mirror/ota/OtaKey.h

          gh release view ota --repo "$repo" >/dev/null 2>&1 ||
            gh release create ota --repo "$repo" --prerelease --title "OTA channels" \
              --notes "Firmware channels for the Mirror updater (Home > More > Firmware channels). Written by CI; do not edit."
          # An existing list must download: a failure here must stop the job, never start from an empty list.
          if gh release view ota --repo "$repo" --json assets -q '.assets[].name' | grep -qx channels.json; then
            gh release download ota --repo "$repo" -p channels.json -D "$work" --clobber
          fi
          old="$(python3 scripts/ota/manifest.py assets --manifest "$work/channels.json" --id "$CHANNEL")"

          asset="$CHANNEL-$rev.bin"
          cp image/firmware.bin "$work/$asset"
          # The image first, then the list that points at it: the list never names an image that is not there yet.
          gh release upload ota "$work/$asset" --repo "$repo" --clobber
          python3 scripts/ota/manifest.py add --manifest "$work/channels.json" --id "$CHANNEL" --title "$TITLE" \
            --rev "$rev" --asset "$asset" --base "$base" --image "$work/$asset"
          openssl dgst -sha256 -sign "$work/key.pem" -out "$work/channels.json.sig" "$work/channels.json"
          openssl ec -in "$work/key.pem" -pubout -out "$work/pub.pem" 2>/dev/null
          openssl dgst -sha256 -verify "$work/pub.pem" -signature "$work/channels.json.sig" "$work/channels.json"
          gh release upload ota "$work/channels.json" "$work/channels.json.sig" --repo "$repo" --clobber
          for a in $old; do
            [ "$a" = "$asset" ] || gh release delete-asset ota "$a" --repo "$repo" --yes || true
          done
          rm -f "$work/key.pem"
          echo "Published $CHANNEL ($rev) to the OTA channel list" >> "$GITHUB_STEP_SUMMARY"
