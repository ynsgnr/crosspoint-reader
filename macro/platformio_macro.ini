; Macro deck environments: the mirror environments plus -DCROSSPOINT_MACRO=1 (see macro/README.md).
; Included from platformio.ini through `extra_configs`. Needs mirror/ for the BLE stack and the HID keyboard.
;
;   pio run -e macro        -t upload   # X4 (ESP32-C3)
;   pio run -e x4pro-macro  -t upload   # X4 Pro (ESP32-S3)

[macro]
build_flags =
  -DCROSSPOINT_MACRO=1
  -Imacro
extra_scripts =
  ${mirror.extra_scripts}
  pre:macro/build.py

[env:macro]
extends = env:mirror
build_flags =
  ${env:mirror.build_flags}
  ${macro.build_flags}
extra_scripts = ${macro.extra_scripts}

[env:x4pro-macro]
extends = env:x4pro-mirror
build_flags =
  ${env:x4pro-mirror.build_flags}
  ${macro.build_flags}
extra_scripts = ${macro.extra_scripts}
