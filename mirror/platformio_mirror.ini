; Mirror feature environments. Included from platformio.ini through `extra_configs` (the only upstream line).
; A build that does not use one of these environments contains none of the mirror code.
;
;   pio run -e mirror        -t upload   # X4 (ESP32-C3), like env:default
;   pio run -e x4pro-mirror  -t upload   # X4 Pro (ESP32-S3)
;   pio test / cmake: see mirror/README.md for the host simulator and tests

[mirror]
build_flags =
  -DCROSSPOINT_MIRROR=1
  ; NimBLE-Arduino enables a role unless <ROLE>_DISABLED is defined. The page-turner config defines both
  ; (central-only); the mirror is a GATT peripheral that advertises, so lift them. Later -U wins over earlier -D.
  -UCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -UCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -Imirror
  -Imirror/generated
; Compile mirror/ into the firmware program itself (not an archive) so templates can self-register.
build_src_filter =
  +<*>
  +<../mirror/core/>
  +<../mirror/device/>
  +<../mirror/templates/>

[env:mirror]
extends = env:default
build_flags =
  ${env:default.build_flags}
  ${mirror.build_flags}
  ; scripts/git_branch.py injects a version only for the envs named default and sticky.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-mirror\"
build_src_filter = ${mirror.build_src_filter}

[env:x4pro-mirror]
extends = env:x4pro
build_flags =
  ${env:x4pro.build_flags}
  ${mirror.build_flags}
build_src_filter = ${mirror.build_src_filter}
